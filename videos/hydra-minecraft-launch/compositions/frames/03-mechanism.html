<template data-composition-id="03-mechanism">
  <style>
    @font-face {
      font-family: "Press Start 2P";
      src: url("assets/fonts/press-start-2p.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: "VT323";
      src: url("assets/fonts/vt323.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
    }

    /* Full-bleed night canvas — its own clip layer on the lowest track */
    #mech-bg {
      position: absolute;
      inset: 0;
      background-color: #0B0F14;
    }

    /* ===== Virtual camera: a wide world panned laterally ===== */
    /* World is 3x canvas wide; the camera centers each station in turn. */
    #mech-world {
      position: absolute;
      top: 0;
      left: 0;
      width: 5760px;
      height: 900px;               /* keep all station content in top 83% */
      transform-origin: 0 0;
      will-change: transform;
    }

    /* Dashed pink connector spanning the pipeline in world space.
       Vertically centered on the station blocks (~y 470). */
    #mech-connector {
      position: absolute;
      top: 468px;
      left: 700px;
      width: 3830px;              /* from station 1 out toward station 3 */
      height: 8px;
      background-image: repeating-linear-gradient(
        to right,
        #7FB4FF 0 36px,
        transparent 36px 66px
      );
    }

    /* ---- Station block (bordered voxel card) ---- */
    .station {
      position: absolute;
      top: 260px;                 /* block spans ~260..680, caption below to ~820 */
      width: 460px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform, opacity;
    }
    .st-block {
      width: 460px;
      height: 420px;
      box-sizing: border-box;
      background-color: #10162E;
      border: 8px solid #F2E7D5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }
    .st-title {
      font-family: "Press Start 2P", monospace;
      font-size: 34px;
      line-height: 1.0;
      color: #F2E7D5;
      text-transform: uppercase;
      text-align: center;
    }
    .st-cap {
      font-family: "VT323", monospace;
      font-size: 40px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #D9CD8E;
      margin-top: 34px;
      text-align: center;
    }

    /* Station 1 — YOUR BROWSER (green icon block) */
    #station-1 { left: 730px; }    /* center at world x = 960 */
    #station-1 .st-block { border-color: #F2E7D5; }
    .grass-cube {
      position: relative;
      width: 132px;
      height: 132px;
      background-color: #59A832;
      border: 7px solid #F2E7D5;
    }
    .grass-cube::after {           /* dirt band under the grass top */
      content: "";
      position: absolute;
      left: 7px; right: 7px; bottom: 7px;
      height: 40%;
      background-color: #3E7A24;
    }
    .click-mark {
      font-family: "Press Start 2P", monospace;
      font-size: 26px;
      color: #7FB4FF;
      text-transform: uppercase;
    }

    /* Station 2 — RELAY (signs) */
    #station-2 { left: 2650px; }   /* center at world x = 2880 */
    .relay-glyph {
      display: flex;
      gap: 14px;
    }
    .relay-glyph span {
      width: 34px;
      height: 90px;
      background-color: #7FB4FF;
      border: 5px solid #F2E7D5;
    }
    .relay-glyph span:nth-child(2) { height: 130px; }
    .relay-glyph span:nth-child(3) { height: 66px; }

    /* Tx-pill that pops on the connector as station 2 arrives */
    #tx-pill {
      position: absolute;
      top: 430px;
      left: 2250px;
      padding: 14px 26px;
      background-color: #10162E;
      border: 6px solid #7FB4FF;
      font-family: "VT323", monospace;
      font-size: 34px;
      letter-spacing: 0.06em;
      color: #7FB4FF;
      text-transform: uppercase;
      transform-origin: 50% 100%;
      will-change: transform, opacity;
    }

    /* Station 3 — HYDRA HEAD (blue-bordered) */
    #station-3 { left: 4570px; }   /* center at world x = 4800 */
    #station-3 .st-block { border-color: #7FB4FF; }
    .utxo-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }
    .utxo-stack i {
      display: block;
      width: 150px;
      height: 34px;
      background-color: #7FB4FF;
      border: 5px solid #F2E7D5;
    }
    .utxo-stack i:nth-child(2) { width: 120px; }
    .utxo-stack i:nth-child(3) { width: 90px; }

    /* ✓ INVISIBLE chip — pops above station 3 and holds */
    #inv-chip {
      position: absolute;
      top: 150px;
      left: 4640px;
      padding: 16px 30px;
      background-color: #59A832;
      border: 7px solid #F2E7D5;
      font-family: "Press Start 2P", monospace;
      font-size: 28px;
      color: #0B0F14;
      text-transform: uppercase;
      transform-origin: 50% 100%;
      will-change: transform, opacity;
    }

    /* ===== Scene 1: three "NO" stamps, over the pipeline, screen-fixed ===== */
    .stamp-row {
      position: absolute;
      left: 0; right: 0;
      top: 340px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 90px;
      pointer-events: none;
    }
    .no-stamp {
      width: 340px;
      height: 300px;
      box-sizing: border-box;
      background-color: #10162E;
      border: 8px solid #D94534;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: 50% 50%;
      will-change: transform, opacity;
    }
    .no-stamp span {
      font-family: "Press Start 2P", monospace;
      font-size: 40px;
      line-height: 1.2;
      color: #F2E7D5;
      text-transform: uppercase;
      text-align: center;
    }
    .no-stamp span b {
      color: #D94534;
      font-weight: 400;
    }
  </style>

  <div id="root" data-composition-id="03-mechanism" data-width="1920" data-height="1080">
    <!-- Full-bleed night ground -->
    <div id="mech-bg" class="clip" data-start="0" data-duration="7.829" data-track-index="0"></div>

    <!-- Wide world panned by the virtual camera (track 1) -->
    <div id="mech-world" class="clip" data-start="0" data-duration="7.829" data-track-index="1">
      <div id="mech-connector"></div>

      <!-- Station 1 — YOUR BROWSER -->
      <div id="station-1" class="station">
        <div class="st-block">
          <div class="grass-cube"></div>
          <div class="click-mark">&gt; CLICK</div>
          <div class="st-title">YOUR<br>BROWSER</div>
        </div>
        <div class="st-cap">RUNS THE GAME</div>
      </div>

      <!-- Station 2 — RELAY -->
      <div id="station-2" class="station">
        <div class="st-block">
          <div class="relay-glyph"><span></span><span></span><span></span></div>
          <div class="st-title">RELAY</div>
        </div>
        <div class="st-cap">SIGNS Ed25519</div>
      </div>

      <!-- tx-pill on the connector -->
      <div id="tx-pill">TX &middot; SIGNED</div>

      <!-- Station 3 — HYDRA HEAD -->
      <div id="station-3" class="station">
        <div class="st-block">
          <div class="utxo-stack"><i></i><i></i><i></i></div>
          <div class="st-title">HYDRA<br>HEAD</div>
        </div>
        <div class="st-cap">ZERO-FEE L2</div>
      </div>

      <!-- ✓ INVISIBLE chip -->
      <div id="inv-chip">&#10003; INVISIBLE</div>
    </div>

    <!-- Scene 1 — three NO stamps, screen-fixed above the pipeline (track 2) -->
    <div class="stamp-row clip" data-start="0" data-duration="2.2" data-track-index="2">
      <div id="stamp-1" class="no-stamp"><span>NO<br><b>WALLET</b></span></div>
      <div id="stamp-2" class="no-stamp"><span>NO<br><b>POPUPS</b></span></div>
      <div id="stamp-3" class="no-stamp"><span>NO<br><b>FEES</b></span></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---- Virtual camera (single source of truth) ----
    // World is 5760 wide; canvas 1920. To center a station at world x = SX,
    // the world translates so SX lands at viewport center 960: cam.x = 960 - SX.
    const world = document.getElementById("mech-world");
    const cam = { x: 960 - 960 };            // start centered on Station 1 (SX=960)
    function applyCamera() {
      world.style.transform = "translateX(" + cam.x + "px)";
    }
    applyCamera();

    // Station world-center X positions.
    const SX1 = 960, SX2 = 2880, SX3 = 4800;

    // ===== Scene 1 (0.0–1.8s): three NO stamps hard-cut in, one per cue,
    // then knock back to reveal the pipeline. =====
    // Stamps sit ABOVE the world layer and are gone before the pan begins.
    tl.fromTo("#stamp-1",
      { scale: 0, opacity: 0, rotation: -6 },
      { scale: 1, opacity: 1, rotation: -3, duration: 0.16, ease: "power4.out" }, 0.10);
    tl.fromTo("#stamp-2",
      { scale: 0, opacity: 0, rotation: 5 },
      { scale: 1, opacity: 1, rotation: 3, duration: 0.16, ease: "power4.out" }, 0.62);
    tl.fromTo("#stamp-3",
      { scale: 0, opacity: 0, rotation: -5 },
      { scale: 1, opacity: 1, rotation: -2, duration: 0.16, ease: "power4.out" }, 1.14);

    // Knock the whole stamp row back to clear the pipeline (Scene 1 -> Scene 2).
    // (Row's clip window ends at 2.2s, so this is not an inter-frame exit — it is
    // a within-scene clear per the storyboard.)
    tl.to(".no-stamp",
      { scale: 1.3, opacity: 0, duration: 0.30, ease: "power2.in", stagger: 0.05 }, 1.66);

    // ===== Scene 2 (1.8–3.6s): camera holds on Station 1 "YOUR BROWSER". =====
    // Reveal the station under the clearing stamps (fromTo so it's correct at t=0).
    tl.fromTo("#station-1",
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.40, ease: "power3.out" }, 1.80);
    // The dashed connector draws in rightward off-frame under Station 1.
    tl.fromTo("#mech-connector",
      { scaleX: 0 },
      { scaleX: 1, duration: 0.7, ease: "power2.out", transformOrigin: "0 50%" }, 2.10);
    // Stations 2 & 3 pre-exist in world space but stay invisible until arrival.
    tl.set(["#station-2", "#station-3", "#tx-pill", "#inv-chip"], { opacity: 0 }, 0);

    // ===== Scene 3 (3.6–5.6s): PAN RIGHT to center Station 2 "RELAY". =====
    tl.to(cam,
      { x: 960 - SX2, duration: 1.15, ease: "power2.inOut", onUpdate: applyCamera }, 3.60);
    // Station 2 reveals as it centers.
    tl.fromTo("#station-2",
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 4.35);
    // tx-pill pops on the connector as it passes.
    tl.fromTo("#tx-pill",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, 4.55);

    // ===== Scene 4 (5.6–7.829s): PAN RIGHT to Station 3 "HYDRA HEAD", =====
    // ✓ INVISIBLE chip pops and holds; camera settles still.
    tl.to(cam,
      { x: 960 - SX3, duration: 1.10, ease: "power2.inOut", onUpdate: applyCamera }, 5.60);
    tl.fromTo("#station-3",
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 6.30);
    tl.fromTo("#inv-chip",
      { scale: 0, opacity: 0, y: 14 },
      { scale: 1, opacity: 1, y: 0, duration: 0.50, ease: "power3.out" }, 6.85);
    // Camera goes static on the punchline — held read to end (no exit).

    window.__timelines["03-mechanism"] = tl;
  </script>
</template>
