<template data-composition-id="05-mining">
  <style>
    @font-face {
      font-family: "Press Start 2P";
      src: url("assets/fonts/press-start-2p.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: "VT323";
      src: url("assets/fonts/vt323.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
    }

    /* Full-bleed dark ground — its own clip layer on the lowest track */
    #mine-bg {
      position: absolute;
      inset: 0;
      background-color: #0B0F14;
    }

    /* Held mining screenshot — right ~62% of the canvas, the proof.
       Positioned so the cyan diamond ore (center of the frame) sits in
       this right panel; a 4px ink edge on its left seals it as a block. */
    #mine-shot {
      position: absolute;
      top: 0;
      right: 0;
      width: 1190px;   /* ~62% of 1920 */
      height: 1080px;
      overflow: hidden;
      border-left: 6px solid #F2E7D5;
      will-change: transform, opacity;
    }
    #mine-shot img {
      position: absolute;
      top: 0;
      /* pull the source left so the centered ore lands inside this panel */
      right: 0;
      width: 1920px;
      height: 1080px;
      object-fit: cover;
      /* muted proof, not dimmed heavily */
      filter: saturate(0.82) brightness(0.86);
    }
    /* thin scrim only along the left seam so the mono label stays legible */
    #mine-shot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(11,15,20,0.55) 0%, rgba(11,15,20,0) 26%);
      pointer-events: none;
    }

    /* ---- Left third content column (x: 0–730, y <= 900 keep-out) ---- */

    /* Scene 1: "HOLD TO MINE" mono label, snaps top-left */
    #mine-label {
      position: absolute;
      left: 64px;
      top: 96px;
      background-color: #F2E7D5;
      color: #0B0F14;
      font-family: "VT323", monospace;
      font-size: 40px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
      padding: 12px 22px;
      white-space: nowrap;
      transform-origin: 0% 50%;
      will-change: transform, opacity;
    }

    /* Scene 2: voxel crack-stage hardness bar — 4 bordered blocks,
       fills bottom-to-top on the left third. */
    #mine-bar {
      position: absolute;
      left: 64px;
      bottom: 240px;              /* top of stack sits well above the 900 keep-out */
      width: 300px;
      display: flex;
      flex-direction: column-reverse;   /* first block = bottom */
      gap: 16px;
    }
    .crack-block {
      position: relative;
      height: 118px;
      border: 6px solid #F2E7D5;
      background-color: rgba(11, 15, 20, 0.55);
      box-sizing: border-box;
      overflow: hidden;
    }
    /* the green fill that snaps in per block */
    .crack-block .fill {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #59A832;
      transform: scaleY(0);
      transform-origin: bottom center;   /* grow UP */
      will-change: transform;
    }
    /* crack marks etched into each block face */
    .crack-block .crack {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .crack-block .crack i {
      position: absolute;
      background-color: rgba(11, 15, 20, 0.5);
    }

    /* Scene 3: "3.0s" stamp slams over the left third */
    #mine-stamp {
      position: absolute;
      left: 64px;
      top: 300px;
      width: 560px;
      transform-origin: 8% 50%;
      will-change: transform, opacity;
    }
    #mine-stamp .num {
      display: inline-block;
      background-color: #7FB4FF;
      color: #0B0F14;
      border: 8px solid #0B0F14;
      font-family: "Press Start 2P", monospace;
      font-size: 158px;
      line-height: 0.9;
      letter-spacing: -0.01em;
      padding: 26px 32px 20px;
      /* hard offset shadow, no blur */
      box-shadow: 24px 24px 0 #0B0F14, 24px 24px 0 4px #F2E7D5;
    }
    #mine-stamp .diamond {
      display: block;
      margin-top: 34px;
      color: #7FB4FF;
      font-family: "VT323", monospace;
      font-size: 44px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      will-change: transform, opacity;
    }
    #mine-stamp .diamond::before {
      content: "";
      display: inline-block;
      width: 26px;
      height: 26px;
      margin-right: 16px;
      transform: translateY(2px) rotate(45deg);
      background-color: #7FB4FF;
      border: 4px solid #0B0F14;
    }
  </style>

  <div id="root" data-composition-id="05-mining" data-width="1920" data-height="1080">
    <!-- Full-bleed dark ground -->
    <div id="mine-bg" class="clip" data-start="0" data-duration="5.803" data-track-index="0"></div>

    <!-- Held mining screenshot (right ~62%), the proof -->
    <div id="mine-shot" class="clip" data-start="0" data-duration="5.803" data-track-index="1">
      <img src="assets/game-mine.png" alt="" />
    </div>

    <!-- Scene 1: mono label -->
    <div id="mine-label" class="clip" data-start="0" data-duration="5.803" data-track-index="2">
      HOLD TO MINE
    </div>

    <!-- Scene 2: voxel crack-stage hardness bar (4 blocks, bottom-to-top) -->
    <div id="mine-bar" class="clip" data-start="0" data-duration="5.803" data-track-index="3">
      <div class="crack-block">
        <div class="fill"></div>
        <div class="crack"><i style="left:22%;top:18%;width:36%;height:5px"></i><i style="left:40%;top:28%;width:5px;height:34%"></i></div>
      </div>
      <div class="crack-block">
        <div class="fill"></div>
        <div class="crack"><i style="left:30%;top:22%;width:5px;height:40%"></i><i style="left:30%;top:60%;width:30%;height:5px"></i></div>
      </div>
      <div class="crack-block">
        <div class="fill"></div>
        <div class="crack"><i style="left:18%;top:30%;width:44%;height:5px"></i><i style="left:60%;top:20%;width:5px;height:36%"></i></div>
      </div>
      <div class="crack-block">
        <div class="fill"></div>
        <div class="crack"><i style="left:26%;top:24%;width:5px;height:46%"></i><i style="left:26%;top:24%;width:34%;height:5px"></i></div>
      </div>
    </div>

    <!-- Scene 3: "3.0s" stamp + DIAMOND label -->
    <div id="mine-stamp" class="clip" data-start="0" data-duration="5.803" data-track-index="4">
      <span class="num">3.0s</span>
      <span class="diamond">DIAMOND</span>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    /* ---------------------------------------------------------------
       Scene 1 (0.0–1.4s) — the screenshot CUTS in (held right 62%),
       and on "Hold to mine" the VT323 label SNAPS top-left.
       cut-in: fast opacity + tiny scale settle (gsap-effects, power).
       snap-in: expo.out side-snap from the left edge (kinetic-beat-slam).
    --------------------------------------------------------------- */
    // Screenshot hard cut-in — visible by t<=0.5s, faint scale settle only.
    tl.fromTo(
      "#mine-shot",
      { opacity: 0, scale: 1.04 },
      { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" },
      0.0
    );

    // "HOLD TO MINE" snaps in from the left on its spoken cue (~0.5s).
    tl.fromTo(
      "#mine-label",
      { opacity: 0, x: -120 },
      { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" },
      0.5
    );

    /* ---------------------------------------------------------------
       Scene 2 (1.4–3.6s) — on "crack by crack" a vertical stack of
       FOUR crack-stage blocks fills bottom-to-top, green, each snapping
       on a beat: a voxel progress bar (stat-bars-and-fills, scaleY).
       ONE beat grid drives all four fills (kinetic-beat-slam spine).
    --------------------------------------------------------------- */
    const fills = gsap.utils.toArray("#mine-bar .fill"); // bottom -> top (DOM order)
    const BAR_START = 1.5;
    const BEAT = 0.42;                                    // per-block beat
    fills.forEach((fill, i) => {
      tl.fromTo(
        fill,
        { scaleY: 0 },
        { scaleY: 1, duration: 0.3, ease: "power4.out" },  // hard percussive snap
        BAR_START + i * BEAT
      );
    });

    /* ---------------------------------------------------------------
       Scene 3 (3.6–5.803s) — on "three full seconds" the big blue
       "3.0s" stamp SLAMS in over the left third (Press Start 2P, hard
       offset shadow), "DIAMOND" mono label resolves beneath a beat
       later. The crack bar has already topped out green. Hold still.
       slam: scale-overshoot + fast settle (kinetic-beat-slam, power4).
    --------------------------------------------------------------- */
    const SLAM = 3.65;
    tl.fromTo(
      "#mine-stamp .num",
      { opacity: 0, scale: 1.55, rotation: -3 },
      { opacity: 1, scale: 1, rotation: 0, duration: 0.42, ease: "power4.out" },
      SLAM
    );
    // DIAMOND label rises in a beat behind the silhouette.
    tl.fromTo(
      "#mine-stamp .diamond",
      { opacity: 0, y: 26 },
      { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
      SLAM + 0.26
    );

    window.__timelines["05-mining"] = tl;
  </script>
</template>
