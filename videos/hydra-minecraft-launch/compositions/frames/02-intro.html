<template data-composition-id="02-intro">
  <style>
    @font-face {
      font-family: "Press Start 2P";
      src: url("assets/fonts/press-start-2p.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }
    @font-face {
      font-family: "VT323";
      src: url("assets/fonts/vt323.woff2") format("woff2");
      font-weight: 400;
      font-display: block;
    }

    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
    }

    /* ---- Hero: full-bleed real gameplay vista (NOT dimmed) ---- */
    #intro-vista {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      object-fit: cover;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* ---- Wipe cover: canvas-color panel that slides off to reveal the vista ---- */
    #intro-wipe {
      position: absolute;
      inset: 0;
      background-color: #0B0F14;
      will-change: transform;
    }

    /* ---- Type lockup zone: sky safe zone, upper-left thirds. All y <= 900 ---- */
    .intro-type {
      position: absolute;
      left: 130px;
      top: 120px;
      width: 660px; /* ~34% of 1920 */
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    /* HYDRA / MINECRAFT stacked lockup — Press Start 2P, ink + hard shadow BLOCK */
    .lockup-line {
      font-family: "Press Start 2P", monospace;
      color: #F2E7D5;
      text-transform: uppercase;
      line-height: 1.0;
      letter-spacing: -0.01em;
      /* hard solid drop-shadow block (offset, NO blur) in dark ink */
      text-shadow:
        6px 6px 0 #05080B,
        6px 6px 0 0.5px #05080B;
      will-change: transform, opacity;
      transform-origin: 0% 50%;
    }
    #lockup-hydra {
      font-size: 108px;
    }
    #lockup-mc {
      font-size: 70px;
      margin-top: 22px;
    }

    /* Sub-line — VT323 mono, ink-2 (sand) */
    #intro-subline {
      margin-top: 40px;
      font-family: "VT323", monospace;
      color: #D9CD8E;
      text-transform: uppercase;
      font-size: 44px;
      letter-spacing: 0.08em;
      line-height: 1.1;
      text-shadow: 4px 4px 0 #05080B;
      will-change: transform, opacity;
      transform-origin: 0% 50%;
    }

    /* Badge — small bordered SQUARE block, pink on-chain, hard offset shadow */
    #intro-badge {
      margin-top: 44px;
      display: inline-flex;
      align-items: center;
      padding: 18px 26px;
      background-color: #0B0F14;
      border: 5px solid #7FB4FF;
      /* hard offset shadow, no blur */
      box-shadow: 8px 8px 0 #05080B;
      font-family: "VT323", monospace;
      color: #7FB4FF;
      text-transform: uppercase;
      font-size: 34px;
      letter-spacing: 0.12em;
      line-height: 1.0;
      transform-origin: 0% 50%;
      will-change: transform, opacity;
    }
  </style>

  <div id="root" data-composition-id="02-intro" data-width="1920" data-height="1080">
    <!-- Hero vista, full-bleed, lowest content track. Held ~90% with a barely-there slow scale. -->
    <img
      id="intro-vista"
      class="clip"
      src="assets/game-vista.png"
      alt=""
      data-start="0"
      data-duration="6.613"
      data-track-index="0"
    />

    <!-- Wipe cover panel — slides off to the right to reveal the vista -->
    <div
      id="intro-wipe"
      class="clip"
      data-start="0"
      data-duration="1.6"
      data-track-index="1"
    ></div>

    <!-- Type lockup in the sky safe zone -->
    <div class="intro-type clip" data-start="0" data-duration="6.613" data-track-index="2">
      <div id="lockup-hydra" class="lockup-line">HYDRA</div>
      <div id="lockup-mc" class="lockup-line">MINECRAFT</div>
      <div id="intro-subline">A VOXEL WORLD IN YOUR BROWSER</div>
      <div id="intro-badge">CARDANO &middot; HYDRA L2</div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // ---- Scene 1 (0.0–1.6s): the vista WIPES in full-bleed + holds ----
    // Wipe-in: the canvas-color cover slides off to the right (x: 0 -> 1920),
    // revealing the hero. fromTo so t=0 is the fully-covered start under seek.
    tl.fromTo(
      "#intro-wipe",
      { x: 0 },
      { x: 1920, duration: 0.62, ease: "power3.inOut" },
      0.0
    );

    // Hero held ~90%: a barely-there 1.00 -> 1.02 slow scale, NO pan, whole duration.
    tl.fromTo(
      "#intro-vista",
      { scale: 1.0 },
      { scale: 1.02, duration: 6.613, ease: "none" },
      0.0
    );

    // On "This is Hydra Minecraft": the lockup SNAPS into the sky upper-left.
    // snap-in (kinetic-beat-slam form): stacked lines, distinct short attacks.
    tl.fromTo(
      "#lockup-hydra",
      { x: -70, scale: 0.9, opacity: 0 },
      { x: 0, scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" },
      0.42
    );
    tl.fromTo(
      "#lockup-mc",
      { x: -70, scale: 0.9, opacity: 0 },
      { x: 0, scale: 1, opacity: 1, duration: 0.42, ease: "expo.out" },
      0.58
    );

    // ---- Scene 2 (1.6–4.0s): on "voxel world in your browser" the sub-line SNAPS in ----
    tl.fromTo(
      "#intro-subline",
      { x: -50, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
      1.62
    );

    // ---- Scene 3 (4.0–6.613s): on "Cardano's Hydra layer two" the badge POPS ----
    // spring-pop entrance: scale 0 -> 1 on a smooth power3 settle (no overshoot).
    tl.fromTo(
      "#intro-badge",
      { scale: 0, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
      4.02
    );

    // Then fully still — held read to end (no further motion beyond the slow hero scale).

    window.__timelines["02-intro"] = tl;
  </script>
</template>
